# BDD100K 数据集配置
path: D:/11ljx-work/BDD_contest/datasets   # 数据集根目录
train: images/train                         # 训练集（相对 path）
val: images/val                             # 验证集（相对 path）
test: images/test                           # 测试集（可选）

# 类别
nc: 9                                       # 类别数量
names:                                      # 类别名（顺序必须和标签里的 class 编号一致）
  - bus              # 0
  - traffic light    # 1
  - traffic sign     # 2
  - person           # 3
  - bike             # 4
  - truck            # 5
  - motor            # 6
  - car              # 7
  - rider            # 8